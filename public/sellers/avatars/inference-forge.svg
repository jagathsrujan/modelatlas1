<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Inference Forge — API hammer on anvil</title>
<rect width="512" height="512" rx="32" fill="#fcfcfa"/>
